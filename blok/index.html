<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b1fa2">
  <title>Permainan Warga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/puzzle-page.css">
  <script type="module" src="../shared/puzzle-page.js"></script>
</head>
<body data-screen="home">
<div id="app">
  <section id="screen-home" class="screen screen-home">
    <header class="home-head">
      <button type="button" class="icon-btn" id="btn-hub" aria-label="Kembali ke Arked Warga">‹</button>
      <button type="button" class="profile-chip" id="profile-chip"><span class="avatar" id="chip-avatar" aria-hidden="true">?</span><span class="chip-text"><strong id="chip-name">Tetapkan profil</strong><small id="chip-meta">Nama, kategori &amp; kampus</small></span></button>
      <div class="head-actions"><button type="button" class="icon-btn" id="btn-help" aria-label="Cara bermain">?</button><button type="button" class="icon-btn" id="btn-close-app" aria-label="Tutup permainan">×</button></div>
    </header>
    <div class="puzzle-brand"><div class="emblem" id="game-icon" aria-hidden="true"></div><h1 id="game-name"></h1><p id="game-description"></p></div>
    <dl class="puzzle-home-stats"><div><dt>Markah terbaik</dt><dd id="st-best">0</dd></div><div><dt>Dimainkan</dt><dd id="st-played">0</dd></div></dl>
    <div class="puzzle-actions"><button type="button" class="btn btn-primary btn-wide" id="btn-play">Main</button><button type="button" class="btn btn-ghost btn-wide" id="btn-board">Papan Markah</button></div>
    <button type="button" class="app-version" id="btn-version" aria-label="Muat semula permainan">Versi 1.0</button>
  </section>
  <section id="screen-game" class="screen screen-game" hidden>
    <header class="bar"><button type="button" class="icon-btn" id="btn-quit" aria-label="Kembali ke laman utama">‹</button><div class="bar-mid"><span class="bar-title" id="game-score">0</span><span class="bar-sub" id="game-mode"></span></div><button type="button" class="icon-btn" id="btn-game-help" aria-label="Cara bermain">?</button></header>
    <div class="puzzle-stage"><p class="puzzle-status" id="game-status" role="status"></p><div class="puzzle-grid" id="game-grid" role="group"></div><div id="game-controls"></div><button type="button" class="btn btn-ghost" id="btn-finish">Tamat &amp; Simpan Markah</button></div>
  </section>
  <section id="screen-result" class="screen screen-result" hidden>
    <header class="bar"><button type="button" class="icon-btn" id="res-home" aria-label="Kembali ke laman utama">‹</button></header>
    <div class="puzzle-result"><div class="emblem" id="res-icon" aria-hidden="true"></div><h2 id="res-title"></h2><p id="res-detail"></p><div class="score" id="res-score"></div><p id="res-time"></p><div class="res-submit" id="res-submit" role="status"></div><div class="puzzle-actions"><button type="button" class="btn btn-primary" id="res-again">Main Lagi</button><button type="button" class="btn btn-ghost" id="res-board">Papan Markah</button></div></div>
  </section>
  <section id="screen-board" class="screen screen-board" hidden>
    <header class="bar"><button type="button" class="icon-btn" id="btn-board-back" aria-label="Kembali">‹</button><div class="bar-mid"><span class="bar-title">Papan Markah</span><span class="bar-sub" id="board-sub"></span></div><button type="button" class="icon-btn" id="btn-board-refresh" aria-label="Muat semula">↻</button></header>
    <div class="tabs" role="tablist"><button type="button" role="tab" data-tab="daily" aria-selected="true">Hari Ini</button><button type="button" role="tab" data-tab="alltime" aria-selected="false">Keseluruhan</button><button type="button" role="tab" data-tab="campus" aria-selected="false">Kampus</button></div><div class="lb-body" id="lb-body" role="tabpanel"></div>
  </section>
</div>
<dialog id="dlg-profile" class="dialog"><form id="profile-form" method="dialog" novalidate><h2>Profil Pemain</h2><p class="muted">Digunakan dalam semua permainan dan papan markah.</p><label class="field"><span>Nama panggilan</span><input id="pf-name" name="nickname" maxlength="20" required autocomplete="nickname" placeholder="cth. Siti_FSKM"></label><label class="field"><span>Kategori</span><span class="select-wrap"><select id="pf-type" name="user_type" required aria-describedby="pf-type-hint"></select></span><small class="field-hint" id="pf-type-hint" hidden></small></label><label class="field"><span>Kampus</span><span class="select-wrap"><select id="pf-campus" name="campus" required></select></span></label><p class="form-error" id="pf-error" role="alert"></p><div class="dialog-actions"><button type="button" class="btn btn-ghost" id="pf-cancel">Batal</button><button type="submit" class="btn btn-primary">Simpan</button></div></form></dialog>
<dialog id="dlg-help" class="dialog"><h2>Cara Bermain</h2><p class="muted" id="help-text"></p><div class="dialog-actions"><button type="button" class="btn btn-primary" id="help-close">Faham!</button></div></dialog>
</body>
</html>
